version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # One PR a week for routine minor/patch bumps; majors and security
      # fixes still get their own PRs.
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    ignore:
      # Stay on TypeScript 6.0.x: typescript-eslint (used by eslint-config-next)
      # supports TypeScript <6.1, and the TypeScript 7 package no longer
      # exports the classic compiler API that typescript-eslint loads.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
